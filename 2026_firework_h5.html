<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>2026跨年烟花盛典</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background: #000; /* 纯黑背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        /* 倒计时/2026 文字样式 */
        .text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* 不遮挡画布交互 */
        }
        .countdown {
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            font-size: 10vw; /* 自适应屏幕大小 */
            color: #fff;
            text-align: center;
        }
        .title-2026 {
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            font-size: 20vw; /* 超大号文字，自适应屏幕 */
            color: #fff;
            text-align: center;
            opacity: 0.9;
            animation: flash 2s infinite alternate; /* 闪烁效果 */
        }
        /* 2026闪烁动画 */
        @keyframes flash {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }
        /* 底部ESC提示 */
        .tips {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            color: #fff;
            opacity: 0.8;
            pointer-events: none;
        }
        /* 画布铺满屏幕 */
        canvas {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <!-- 文字容器（倒计时/2026） -->
    <div class="text-container">
        <div class="countdown" id="countdown">10</div>
        <div class="title-2026" id="title2026" style="display: none;">2026</div>
    </div>
    <!-- 底部提示 -->
    <div class="tips">按ESC退出</div>
    <!-- 画布（绘制烟花） -->
    <canvas id="fireworkCanvas"></canvas>

    <script>
        // 1. 初始化画布和全局变量
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdown');
        const title2026El = document.getElementById('title2026');
        
        // 设置画布尺寸为屏幕大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 颜色配置（对应原Python代码的高亮度色系）
        const COLORS = [
            [255, 0, 0], [255, 165, 0], [255, 255, 0], [0, 255, 0],
            [0, 0, 255], [75, 0, 130], [238, 130, 238], [255, 192, 203], [255, 255, 255]
        ];

        // 全局状态
        let countdownSeconds = 10;
        let countdownOver = false;
        let fireworkParticles = [];
        let lastFireworkTime = Date.now();
        const fireworkInterval = 300; // 每300ms生成一组烟花

        // 2. 倒计时逻辑（对应原Python的10秒倒计时）
        const countdownTimer = setInterval(() => {
            countdownSeconds--;
            countdownEl.textContent = countdownSeconds;
            
            if (countdownSeconds <= 0) {
                clearInterval(countdownTimer);
                countdownOver = true;
                // 隐藏倒计时，显示2026标题
                countdownEl.style.display = 'none';
                title2026El.style.display = 'block';
            }
        }, 1000);

        // 3. 烟花粒子类（还原原Python的FireworkParticle）
        class FireworkParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // 随机角度和速度
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2 + Math.random() * 4;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                // 随机颜色和大小
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.size = 2 + Math.random() * 2;
                // 生命周期
                this.life = 60;
                this.alpha = 255;
            }

            // 更新粒子状态（重力、阻力、生命周期）
            update() {
                // 重力效果
                this.vy += 0.05;
                // 空气阻力
                this.vx *= 0.98;
                this.vy *= 0.98;
                // 更新位置
                this.x += this.vx;
                this.y += this.vy;
                // 更新生命周期和透明度
                this.life--;
                this.alpha = Math.max(0, this.alpha - 4);
            }

            // 绘制粒子
            draw() {
                if (this.life > 0 && this.alpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = this.alpha / 255;
                    ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // 4. 生成一组烟花
        function createFirework() {
            // 随机发射位置（屏幕下方20%~80%宽度）
            const x = canvas.width * 0.2 + Math.random() * canvas.width * 0.6;
            const y = canvas.height;
            // 生成200~300个粒子（对应原Python）
            const particleCount = 200 + Math.floor(Math.random() * 100);
            for (let i = 0; i < particleCount; i++) {
                fireworkParticles.push(new FireworkParticle(x, y));
            }
        }

        // 5. 动画循环（核心渲染逻辑）
        function animate() {
            requestAnimationFrame(animate);
            
            // 填充纯黑背景（保留轻微拖影，更流畅）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 倒计时结束后生成烟花
            if (countdownOver) {
                const currentTime = Date.now();
                // 控制烟花生成频率
                if (currentTime - lastFireworkTime > fireworkInterval) {
                    createFirework();
                    lastFireworkTime = currentTime;
                }

                // 更新并绘制所有粒子
                for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                    const particle = fireworkParticles[i];
                    particle.update();
                    particle.draw();

                    // 移除生命周期结束的粒子
                    if (particle.life <= 0) {
                        fireworkParticles.splice(i, 1);
                    }
                }
            }
        }

        // 6. 绑定ESC退出事件（对应原Python）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // 浏览器环境下无法直接退出，可隐藏内容或提示
                alert('已退出烟花盛典');
                countdownOver = false;
                title2026El.style.display = 'none';
                fireworkParticles = [];
            }
        });

        // 启动动画
        animate();
    </script>
</body>
</html>
